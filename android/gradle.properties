# Stable Windows/Flutter build settings.
# The project is on E: while Pub Cache is commonly on C:, which can trigger
# Kotlin incremental-cache collisions for Flutter Android plugins.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Work around Kotlin incremental cache / "Storage is already registered" failures.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process

# Prefer reliability over build speed on Windows.
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
