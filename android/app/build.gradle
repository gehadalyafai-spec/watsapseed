plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()

if (hasReleaseSigning) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def generatedLauncherResDir = file("$buildDir/generated/launcher-res")

tasks.register("generateLauncherIcons") {
    def sourceFile = file("../../assets/icons/app_icon.png")

    inputs.file(sourceFile)
    outputs.dir(generatedLauncherResDir)

    doLast {
        if (!sourceFile.exists()) {
            throw new GradleException("Missing high-quality launcher icon: ${sourceFile}")
        }

        def sourceImage = javax.imageio.ImageIO.read(sourceFile)
        if (sourceImage == null) {
            throw new GradleException("Unable to decode launcher icon: ${sourceFile}")
        }

        if (generatedLauncherResDir.exists()) {
            generatedLauncherResDir.deleteDir()
        }

        def sizes = [
            mdpi   : 48,
            hdpi   : 72,
            xhdpi  : 96,
            xxhdpi : 144,
            xxxhdpi: 192,
        ]

        sizes.each { density, size ->
            def outputDir = new File(
                generatedLauncherResDir,
                "mipmap-${density}",
            )
            outputDir.mkdirs()

            def outputImage = new java.awt.image.BufferedImage(
                size,
                size,
                java.awt.image.BufferedImage.TYPE_INT_ARGB,
            )
            def graphics = outputImage.createGraphics()

            try {
                graphics.setRenderingHint(
                    java.awt.RenderingHints.KEY_INTERPOLATION,
                    java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC,
                )
                graphics.setRenderingHint(
                    java.awt.RenderingHints.KEY_RENDERING,
                    java.awt.RenderingHints.VALUE_RENDER_QUALITY,
                )
                graphics.setRenderingHint(
                    java.awt.RenderingHints.KEY_ANTIALIASING,
                    java.awt.RenderingHints.VALUE_ANTIALIAS_ON,
                )
                graphics.drawImage(sourceImage, 0, 0, size, size, null)
            } finally {
                graphics.dispose()
            }

            def outputFile = new File(outputDir, "ic_launcher.png")
            javax.imageio.ImageIO.write(outputImage, "png", outputFile)
        }
    }
}

android {
    namespace "com.example.watsapseed"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.example.watsapseed"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Local test builds keep working without secrets.
            // Play Store AAB builds must provide android/key.properties.
            signingConfig hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            res.srcDir generatedLauncherResDir
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn tasks.named("generateLauncherIcons")
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source "../.."
}
